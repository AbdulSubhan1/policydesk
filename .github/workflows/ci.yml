name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Types, ESLint (UI library rules included), Prettier, UI registry and usage map
      - run: npm run check
      - run: npm run build
        env:
          AUTH_SECRET: ci-only-secret
