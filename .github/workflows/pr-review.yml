name: PR review

# An AI reviewer that checks every pull request against AGENTS.md.
# Needs the ANTHROPIC_API_KEY repository secret.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the code reviewer for this repository. Review only the changes in this pull request.

            1. Read AGENTS.md. It is the coding standard, and every rule in it is mandatory.
            2. Read components/ui/registry.ts before judging any UI change.
            3. For each changed file, check it against every section of AGENTS.md:
               folder placement, single source of truth, Next.js rules (server components, server actions only,
               permission → validation → write → audit), the UI library rules (no raw controls, no inline styles,
               no class overrides, one component per file, registry entry, data-ui), React Hook Form for data entry,
               i18n (every string in both messages files, RTL-safe classes), security (permission + scope checks,
               audit log), and code style (no any, no dead code, no speculative abstractions).
            4. Also look for real bugs, missing translations, overflow on small screens and duplicated code.

            Post one inline comment per problem, quoting the rule from AGENTS.md that it breaks and showing the fix.
            Finish with a short summary comment. Say "Follows AGENTS.md" if you found nothing.
            Do not comment on things that follow the standard.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
